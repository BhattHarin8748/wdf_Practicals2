<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | StudentHub</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html">Student<span>Hub</span></a><nav id="mainNav"><a href="index.html">Home</a><a href="about.html">About</a><a href="events.html">Events</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a><a href="login.html">Login</a><a class="nav-cta active" href="register.html">Register</a></nav></div></header>
<main class="page"><div class="container form-container"><div class="form-card"><p class="eyebrow">CREATE ACCOUNT</p><h1>Student Registration</h1><p class="muted">Create your StudentHub account.</p><form id="registerForm" method="post" action="register.php" novalidate>
<div class="form-grid"><label for="fullName">Full Name<input id="fullName" name="fullName" type="text" placeholder="Enter full name" autocomplete="name" minlength="2" maxlength="50" required aria-describedby="fullNameError"><small class="error" id="fullNameError" aria-live="polite"></small></label>
<label for="username">Username<input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required aria-describedby="usernameError"><small class="error" id="usernameError" aria-live="polite"></small></label>
<label for="email">Email<input id="email" name="email" type="email" placeholder="student@example.com" autocomplete="email" maxlength="254" required aria-describedby="emailError"><small class="error" id="emailError" aria-live="polite"></small></label>
<label for="mobile">Mobile Number<input id="mobile" name="mobile" type="tel" placeholder="10-digit mobile number" autocomplete="tel" inputmode="tel" maxlength="14" required aria-describedby="mobileError"><small class="error" id="mobileError" aria-live="polite"></small></label>
<label for="course">Course<select id="course" name="course" required aria-describedby="courseError"><option value="">Select course</option><option>B.Tech Computer Engineering</option><option>B.Tech Information Technology</option><option>BCA</option><option>MCA</option></select><small class="error" id="courseError" aria-live="polite"></small></label>
<label for="year">Year<select id="year" name="year" required aria-describedby="yearError"><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select><small class="error" id="yearError" aria-live="polite"></small></label>
<label for="gender">Gender<select id="gender" name="gender" required aria-describedby="genderError"><option value="">Select gender</option><option>Female</option><option>Male</option><option>Other</option></select><small class="error" id="genderError" aria-live="polite"></small></label>
<label for="password">Password<input id="password" name="password" type="password" placeholder="Minimum 8 characters" autocomplete="new-password" minlength="8" required aria-describedby="passwordHelp strengthText passwordError"><small id="passwordHelp" class="muted">Use 8+ characters with a letter, number and symbol.</small><div class="strength" role="meter" aria-label="Password strength" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-valuetext="No password entered"><span id="strengthBar"></span></div><small id="strengthText" class="muted" aria-live="polite"></small><small class="error" id="passwordError" aria-live="polite"></small></label>
<label for="confirmPassword">Confirm Password<input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" autocomplete="new-password" required aria-describedby="confirmPasswordError"><small class="error" id="confirmPasswordError" aria-live="polite"></small></label></div>
<label class="terms" for="terms"><input id="terms" name="terms" type="checkbox" required aria-describedby="termsError"> I accept the StudentHub terms and conditions.<small class="error" id="termsError" aria-live="polite"></small></label>
<button class="btn primary full" type="submit">Create Account</button><p class="form-note">Already registered? <a href="login.html">Login here</a>.</p><div id="formMessage" class="success-box" role="status" tabindex="-1" hidden></div>
</form></div></div></main><footer class="site-footer"><div class="container"><strong>StudentHub</strong><p>Student portal project • Practical 1–5</p></div></footer><script src="assets/js/validation.js"></script><script src="assets/js/main.js"></script></body></html>
