<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | StudentHub</title></head>
<body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html">Student<span>Hub</span></a><nav id="mainNav"><a href="index.html">Home</a><a href="about.html">About</a><a href="events.html">Events</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a><a href="login.html">Login</a><a class="nav-cta active" href="register.html">Register</a></nav></div></header>
<main class="page"><div class="container form-container"><div class="form-card"><p class="eyebrow">CREATE ACCOUNT</p><h1>Student Registration</h1><p class="muted">Create your StudentHub account.</p><form id="registerForm" novalidate>
<div class="form-grid"><label>Full Name<input id="fullName" name="fullName" type="text" placeholder="Enter full name" required><small class="error" id="fullNameError"></small></label>
<label>Email<input id="email" name="email" type="email" placeholder="student@example.com" required><small class="error" id="emailError"></small></label>
<label>Mobile Number<input id="mobile" name="mobile" type="tel" placeholder="10-digit mobile number" required><small class="error" id="mobileError"></small></label>
<label>Course<select id="course" name="course" required><option value="">Select course</option><option>B.Tech Computer Engineering</option><option>B.Tech Information Technology</option><option>BCA</option><option>MCA</option></select><small class="error" id="courseError"></small></label>
<label>Year<select id="year" name="year" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select><small class="error" id="yearError"></small></label>
<label>Gender<select id="gender" name="gender" required><option value="">Select gender</option><option>Female</option><option>Male</option><option>Other</option></select><small class="error" id="genderError"></small></label>
<label>Password<input id="password" name="password" type="password" placeholder="Minimum 8 characters" required><div class="strength"><span id="strengthBar"></span></div><small id="strengthText" class="muted"></small><small class="error" id="passwordError"></small></label>
<label>Confirm Password<input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter password" required><small class="error" id="confirmPasswordError"></small></label></div>
<label class="terms"><input id="terms" type="checkbox"> I accept the StudentHub terms and conditions.<small class="error" id="termsError"></small></label>
<button class="btn primary full" type="submit">Create Account</button><p class="form-note">Already registered? <a href="login.html">Login here</a>.</p><div id="formMessage" class="success-box" hidden></div>
</form></div></div></main><footer class="site-footer"><div class="container"><strong>StudentHub</strong><p>Student portal project • Practical 1–5</p></div></footer><script src="assets/js/validation.js"></script><script src="assets/js/main.js"></script></body></html>
